services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_irrigation_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://agri_user:agri_password@db:5432/smart_irrigation_prod
      - SECRET_KEY=smart-irrigation-production-secret-key-2026
      - JWT_SECRET_KEY=jwt-agriculture-production-key-2026
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: smart_irrigation_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_irrigation_prod
      POSTGRES_USER: agri_user
      POSTGRES_PASSWORD: agri_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri_user -d smart_irrigation_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
